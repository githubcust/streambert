name: Keep
on:
  # 定时触发：使用多个 cron 表达式限定在 06:00-17:00 之间
  schedule:
    # 06:00-16:59 期间每 12 分钟执行一次
    - cron: '*/12 6-16 * * *'   # 小时: 6到16, 分钟: 0,12,24,36,48,60
    # 17:00 整点执行一次（因为 16-17 这个区间不包含 17:00）
    - cron: '0 17 * * *'        # 17:00 执行一次
  # 支持手动触发，方便测试
  workflow_dispatch:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    runs-on: ubuntu
    steps:
      - name: Ping Render Service
        run: |
          echo "⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC') - 正在 Ping 服务..."
          curl -I https://你的服务地址.onrender.com
          echo "✅ 请求完成 - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo
