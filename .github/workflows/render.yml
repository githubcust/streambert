name: Keep Render Alive

on:
  # 定时触发：每 12 分钟执行一次（小于 Render 15 分钟空闲阈值）
  schedule:
    - cron: '*/12 * * * *'   # 小时级: 0,12,24,36,48,60 分钟
  # 支持手动触发，方便测试
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      # 直接使用 curl 发送 HEAD 请求
      - name: Ping Render Service
        run: |
          echo "⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC') - 正在 Ping 服务..."
          curl -I https://你的服务地址.onrender.com
          echo "✅ 请求完成"
